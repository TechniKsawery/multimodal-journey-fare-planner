name: Testy

# Uruchamiane na każdym pull requeście do main (oraz na pushu do main). Bez sekretów i bez MOTIS:
# testy wymagające działającego MOTIS same się pomijają (skip). Test na żywo na realnym MOTIS
# jest osobnym, ręcznym krokiem przed merge dużej zmiany — patrz CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Zainstaluj zależności
        run: pip install -r requirements-dev.txt

      - name: Testy
        run: python -m pytest -q
