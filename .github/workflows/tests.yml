name: Testy

# Uruchamiane na każdym pull requeście do main (oraz na pushu do main). Bez sekretów i bez MOTIS:
# testy wymagające działającego MOTIS same się pomijają (skip). Test na żywo na realnym MOTIS
# jest osobnym, ręcznym krokiem przed merge dużej zmiany — patrz CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Zainstaluj zależności
        run: pip install -r requirements-dev.txt

      - name: Testy
        run: python -m pytest -q
