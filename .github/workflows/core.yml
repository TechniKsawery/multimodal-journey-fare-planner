name: Core (TypeScript port)

# Pure logic in core/ (no network, no secrets). Runs on every pull request to main.
# The Python code in the repo root is the oracle: golden vectors are regenerated from it here and
# must not differ from the committed ones, and the TypeScript port must reproduce them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies (oracle)
        run: pip install -r requirements-dev.txt

      - name: Golden vectors are in sync with the Python oracle
        run: |
          python tools/golden/generate_fares.py
          python tools/golden/generate_misc.py
          python tools/golden/generate_scoring.py
          python tools/golden/generate_attractions.py
          python tools/golden/generate_motis.py
          git diff --exit-code -- core/golden

      - name: Install core
        working-directory: core
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: core
        run: npm run typecheck

      - name: Tests (port vs. oracle)
        working-directory: core
        run: npm test
